<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f3d52; }
      .subtitle { font-size: 13px; fill: #5b7785; }
      .actor { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .msg { font-size: 12px; fill: #0f3d52; }
      .msg-sub { font-size: 10.5px; fill: #5b7785; }
      .note { font-size: 11px; fill: #0f3d52; }
      .life { stroke: #c2d4dd; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .sync { stroke: #1d7fa3; stroke-width: 1.8; fill: none; }
      .async { stroke: #2e7d5b; stroke-width: 1.8; fill: none; }
      .rt { stroke: #c06f2a; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    </style>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d7fa3"/></marker>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2e7d5b"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c06f2a"/></marker>
  </defs>

  <rect width="960" height="560" fill="#f4f8fa"/>
  <text x="40" y="44" class="title">Real-time Quote Flow</text>
  <text x="40" y="66" class="subtitle">How a rate request fans out to carriers and streams results back over SignalR</text>

  <!-- lifelines -->
  <!-- Angular 110, API 330, Carriers 560, SignalR Hub 790 -->
  <g>
    <rect x="40" y="86" width="140" height="40" rx="8" fill="#1d7fa3"/>
    <text x="110" y="111" class="actor" text-anchor="middle">Angular Client</text>
    <line class="life" x1="110" y1="126" x2="110" y2="500"/>

    <rect x="260" y="86" width="140" height="40" rx="8" fill="#2e7d5b"/>
    <text x="330" y="111" class="actor" text-anchor="middle">ASP.NET API</text>
    <line class="life" x1="330" y1="126" x2="330" y2="500"/>

    <rect x="490" y="86" width="150" height="40" rx="8" fill="#c06f2a"/>
    <text x="565" y="111" class="actor" text-anchor="middle">Carrier Adapters</text>
    <line class="life" x1="565" y1="126" x2="565" y2="500"/>

    <rect x="715" y="86" width="150" height="40" rx="8" fill="#6b4e9e"/>
    <text x="790" y="111" class="actor" text-anchor="middle">SignalR Hub</text>
    <line class="life" x1="790" y1="126" x2="790" y2="500"/>
  </g>

  <!-- 1. connect to hub -->
  <path class="rt" d="M110 160 L788 160" marker-end="url(#r)"/>
  <text x="120" y="153" class="msg">1 &#183; connect /hubs/rate-quote &amp; join requestId group</text>

  <!-- 2. POST request -->
  <path class="sync" d="M110 200 L328 200" marker-end="url(#s)"/>
  <text x="120" y="193" class="msg">2 &#183; POST /api/RateQuote</text>
  <!-- 202 back -->
  <path class="sync" d="M330 230 L112 230" marker-end="url(#s)"/>
  <text x="120" y="223" class="msg-sub">202 Accepted &#183; returns requestId</text>

  <!-- 3. resolve ids -->
  <rect x="250" y="252" width="160" height="40" rx="6" fill="#eef4f9" stroke="#cfe2ea"/>
  <text x="330" y="270" class="note" text-anchor="middle">3 &#183; resolve DB IDs</text>
  <text x="330" y="285" class="msg-sub" text-anchor="middle">&#8594; carrier codes</text>

  <!-- 4. parallel carrier calls -->
  <path class="async" d="M330 320 L563 320" marker-end="url(#a)"/>
  <text x="340" y="313" class="msg">4 &#183; query every active carrier in parallel</text>
  <rect x="470" y="336" width="190" height="40" rx="6" fill="#fbefe4" stroke="#f0ddc8"/>
  <text x="565" y="354" class="note" text-anchor="middle">FedEx &#183; UPS &#183; Estes(mock)</text>
  <text x="565" y="369" class="msg-sub" text-anchor="middle">OAuth + rating per adapter</text>

  <!-- 5. each result -> hub -->
  <path class="async" d="M565 404 L788 404" marker-end="url(#a)"/>
  <text x="575" y="397" class="msg">5 &#183; each result / error &#8594; hub</text>

  <!-- 6. hub streams to client -->
  <path class="rt" d="M790 440 L112 440" marker-end="url(#r)"/>
  <text x="120" y="433" class="msg">6 &#183; ReceiveQuotes / ReceiveQuoteError (as they arrive)</text>

  <!-- 7. completed -->
  <path class="rt" d="M790 480 L112 480" marker-end="url(#r)"/>
  <text x="120" y="473" class="msg">7 &#183; AllQuotesCompleted &#8594; client stops loading</text>

  <!-- legend -->
  <g>
    <line class="sync" x1="40" y1="524" x2="70" y2="524" marker-end="url(#s)"/>
    <text x="76" y="528" class="msg-sub">HTTP request</text>
    <line class="async" x1="200" y1="524" x2="230" y2="524" marker-end="url(#a)"/>
    <text x="236" y="528" class="msg-sub">async carrier call</text>
    <line class="rt" x1="380" y1="524" x2="410" y2="524" marker-end="url(#r)"/>
    <text x="416" y="528" class="msg-sub">SignalR (WebSocket) stream</text>
  </g>
</svg>
