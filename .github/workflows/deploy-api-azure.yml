name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'AEspejo.FreightQuotes.Api/**'
      - 'AEspejo.FreightQuotes.Application/**'
      - 'AEspejo.FreightQuotes.Domain/**'
      - 'AEspejo.FreightQuotes.Infrastructure/**'
      - 'AEspejo.FreightQuotes.Shared/**'
      - 'AEspejo.FreightQuotes.CarrierApiClient/**'
      - 'AEspejo.FreightQuotes.Migrations.Sqlite/**'
      - 'AEspejo.FreightQuotes.Migrations.SqlServer/**'
      - 'AEspejo.FreightQuotes.sln'
      - '.github/workflows/deploy-api-azure.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'freightquotesapi'
  PROJECT_PATH: 'AEspejo.FreightQuotes.Api/AEspejo.FreightQuotes.Api.csproj'
  PUBLISH_PATH: '${{ github.workspace }}/publish-api'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AEspejo.FreightQuotes.sln

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
