name: Deploy Angular App to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'AEspejo.FreightQuotes.AngularApp/**'
      - '.github/workflows/azure-static-web-apps-agreeable-field-098225d10.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'AEspejo.FreightQuotes.AngularApp/**'
      - '.github/workflows/azure-static-web-apps-agreeable-field-098225d10.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: AEspejo.FreightQuotes.AngularApp/package-lock.json

      - name: Install dependencies
        working-directory: AEspejo.FreightQuotes.AngularApp
        run: npm ci

      - name: Build Angular application
        working-directory: AEspejo.FreightQuotes.AngularApp
        run: npm run build -- --configuration production

      - name: Copy Static Web Apps configuration
        shell: bash
        run: cp AEspejo.FreightQuotes.AngularApp/staticwebapp.config.json AEspejo.FreightQuotes.AngularApp/dist/aespejo.freight-quotes.angular-app/browser/staticwebapp.config.json

      - name: Verify Angular output
        shell: bash
        run: test -f AEspejo.FreightQuotes.AngularApp/dist/aespejo.freight-quotes.angular-app/browser/index.html

      - name: Deploy prebuilt Angular application
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'AEspejo.FreightQuotes.AngularApp/dist/aespejo.freight-quotes.angular-app/browser'
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
